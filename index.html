<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banho & Tosa</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f8f8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Banho & Tosa">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2a2e;--mu:#6b7a80;--ln:#e6e2d9;--pr:#0f8f8a;--prt:#fff;--ok:#1b8a4b;--okb:#dff3e6;--wa:#b45309;--wab:#fdecd2;--bad:#c0392b;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14191b;--card:#1e2528;--tx:#eef2f3;--mu:#93a3a9;--ln:#2c3639;--pr:#2bb5ae;--prt:#06201f;--ok:#5fd18d;--okb:#17372a;--wa:#f3b563;--wab:#3d2d14;--bad:#ff8577}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:22px;margin:0}
#st{font-size:12px;color:var(--mu)}
main{padding:0 12px;max-width:640px;margin:0 auto}
.day{font-size:13px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 6px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.card.done{opacity:.6}
.time{font-weight:700;font-size:15px;min-width:46px}
.mid{flex:1;min-width:0}
.mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small,.sub{color:var(--mu);font-size:13px}
.right{text-align:right;font-size:13px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.bd{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600}
.ok{background:var(--okb);color:var(--ok)}.wa{background:var(--wab);color:var(--wa)}.nt{background:var(--ln);color:var(--mu)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln);background:none;color:var(--prt);font-size:16px;flex:none;padding:0}
.chk.on{background:var(--pr);border-color:var(--pr)}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--pr)}
.pk{display:block}
.pk .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;padding:6px 0;border-radius:10px}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pr);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--pr);color:var(--prt);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chips{display:flex;gap:8px;margin:8px 0}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 14px;font:inherit;font-size:14px}
.chip.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.tot div{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px}
.tot small{color:var(--mu);display:block;font-size:12px}.tot b{font-size:20px}
.mes{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.mes button{border:1px solid var(--ln);background:var(--card);color:var(--tx);width:40px;height:40px;border-radius:12px;font-size:18px}
.empty{text-align:center;color:var(--mu);padding:40px 16px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:9}
#ov.show{display:flex}
#sh{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
#sh h2{margin:0 0 10px;font-size:19px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;margin-top:12px;background:var(--pr);color:var(--prt)}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.btn.del{background:none;color:var(--bad);border:1px solid var(--bad)}
.vrow{display:flex;justify-content:space-between;padding:10px 12px;background:var(--card);border:1px solid var(--ln);border-radius:12px;margin-top:6px}
.h{display:none}
</style>
</head>
<body>
<header><h1 id="tt">Agenda</h1><span id="st"></span></header>
<main id="m"></main>
<button class="fab" id="fab" aria-label="Novo">+</button>
<nav id="nv">
<button data-t="agenda"><span>📅</span>Agenda</button>
<button data-t="pacotes"><span>📦</span>Pacotes</button>
<button data-t="clientes"><span>🐾</span>Clientes</button>
<button data-t="fin"><span>💰</span>Financeiro</button>
</nav>
<div id="ov"><div id="sh"></div></div>
<script>
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const isoD=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>isoD(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return isoD(d)};
const fmtD=s=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
const fmtS=s=>s?s.slice(8)+'/'+s.slice(5,7):'—';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const TIPOS=['Banho','Tosa','Banho + Tosa'];
let S={precos:{'Banho':60,'Tosa':80,'Banho + Tosa':120},atend:[],pacotes:[],clientes:[]};
let tab='agenda',past=false,mes=today().slice(0,7),ref=null,loaded=false,tm;

/* ---------- persistência ---------- */
async function init(){
  render();
  try{const t=localStorage.getItem('bt');if(t)S=Object.assign(S,JSON.parse(t))}catch(e){}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  loaded=true;render();setSt();
}
function setSt(t){$('#st').textContent=t||'✓ salvo neste aparelho'}
function save(){
  clearTimeout(tm);setSt('salvando…');
  tm=setTimeout(async()=>{
    try{
      localStorage.setItem('bt',JSON.stringify(S));
      setSt();
    }catch(e){setSt('⚠ erro ao salvar')}
  },400);
}

/* ---------- helpers de dados ---------- */
const visitas=pid=>S.atend.filter(a=>a.pacote===pid).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
const petNames=()=>[...new Set([...S.clientes.map(c=>c.pet),...S.atend.map(a=>a.pet),...S.pacotes.map(p=>p.pet)])].filter(Boolean).sort();
const badge=(v,r)=>{const f=(+v||0)-(+r||0);return f<=0.005?'<span class="bd ok">Pago</span>':'<span class="bd wa">Falta '+brl(f)+'</span>'};
const pacOf=id=>S.pacotes.find(x=>x.id===id);
const cli=n=>S.clientes.find(c=>c.pet.toLowerCase()===String(n||'').trim().toLowerCase());
const wa=(c,m)=>{let d=(c.tel||'').replace(/\D/g,'');if(d.length<=11)d='55'+d;return 'https://wa.me/'+d+(m?'?text='+encodeURIComponent(m):'')};

/* ---------- telas ---------- */
function render(){
  document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#tt').textContent={agenda:'Agenda',pacotes:'Pacotes',clientes:'Clientes',fin:'Financeiro'}[tab];
  $('#fab').style.display=tab==='fin'?'none':'block';
  $('#m').innerHTML=!loaded?'<div class="empty">Carregando…</div>':({agenda:vAgenda,pacotes:vPacotes,clientes:vClientes,fin:vFin}[tab])();
}
function vAgenda(){
  const t=today();
  let l=S.atend.filter(a=>past?a.data<t:a.data>=t).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
  if(past)l.reverse();
  let h='<div class="chips"><button class="chip '+(!past?'on':'')+'" data-past="0">Próximos</button><button class="chip '+(past?'on':'')+'" data-past="1">Anteriores</button></div>';
  if(!l.length)return h+'<div class="empty">Nenhum atendimento.<br>Toque no + para agendar.</div>';
  let d='';
  for(const a of l){
    if(a.data!==d){d=a.data;h+='<div class="day">'+(d===t?'Hoje · ':d===addDays(t,1)?'Amanhã · ':'')+fmtD(d)+'</div>'}
    const pk=a.pacote&&pacOf(a.pacote),vs=pk?visitas(pk.id):[];
    const dir=pk?'<span class="bd nt">Pacote '+(vs.indexOf(a)+1)+'/'+vs.length+'</span>':'<b>'+brl(a.valor)+'</b>'+badge(a.valor,a.recebido);
    h+='<div class="card '+(a.feito?'done':'')+'" data-a="'+a.id+'"><button class="chk '+(a.feito?'on':'')+'" data-done="'+a.id+'">'+(a.feito?'✓':'')+'</button><div class="time">'+esc(a.hora)+'</div><div class="mid"><b>'+esc(a.pet)+'</b><small>'+esc(a.tipo)+(a.obs?' · '+esc(a.obs):'')+(cli(a.pet)?.end?'<br>📍 '+esc(cli(a.pet).end):'')+'</small></div><div class="right">'+dir+'</div></div>';
  }
  return h;
}
function vPacotes(){
  if(!S.pacotes.length)return '<div class="empty">Nenhum pacote ainda.<br>Toque no + para criar.</div>';
  const info=S.pacotes.map(p=>{const v=visitas(p.id);return{p,v,f:v.filter(x=>x.feito).length,end:v.length?v[v.length-1].data:''}});
  info.sort((a,b)=>((a.f>=a.v.length)-(b.f>=b.v.length))||a.end.localeCompare(b.end));
  return info.map(({p,v,f,end})=>{
    const fim=v.length&&f>=v.length,prox=v.find(x=>!x.feito);
    return '<div class="card pk" data-p="'+p.id+'"><div class="row"><b>'+esc(p.pet)+'</b>'+badge(p.valor,p.recebido)+'</div><div class="sub">'+esc(p.tipo)+' · '+brl(p.valor)+'</div><div class="bar"><i style="width:'+(v.length?f/v.length*100:0)+'%"></i></div><div class="row sub"><span>'+f+' de '+v.length+' feitos'+(fim?' · concluído':'')+'</span><span>Último banho: <b>'+fmtS(end)+'</b></span></div>'+(prox&&!fim?'<div class="sub" style="margin-top:4px">Próximo: '+fmtD(prox.data)+' às '+esc(prox.hora)+'</div>':'')+'</div>';
  }).join('');
}
function items(){
  const r=[];
  S.atend.filter(a=>!a.pacote&&a.data.slice(0,7)===mes).forEach(a=>r.push({k:'a',id:a.id,pet:a.pet,d:a.data,sub:a.tipo,v:+a.valor||0,r:+a.recebido||0}));
  S.pacotes.forEach(p=>{const v=visitas(p.id),d=v.length?v[0].data:'';if(d.slice(0,7)===mes)r.push({k:'p',id:p.id,pet:p.pet,d,sub:'Pacote '+v.length+'x '+p.tipo,v:+p.valor||0,r:+p.recebido||0})});
  return r;
}
function vFin(){
  const it=items(),rec=it.reduce((s,x)=>s+Math.min(x.r,x.v),0),tot=it.reduce((s,x)=>s+x.v,0);
  const [y,m]=mes.split('-'),nome=new Date(+y,+m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  it.sort((a,b)=>((b.v-b.r>0.005)-(a.v-a.r>0.005))||a.d.localeCompare(b.d));
  let h='<div class="mes"><button data-m="-1">‹</button><b style="text-transform:capitalize">'+nome+'</b><button data-m="1">›</button></div>';
  h+='<div class="tot"><div><small>Recebido</small><b style="color:var(--ok)">'+brl(rec)+'</b></div><div><small>A receber</small><b style="color:var(--wa)">'+brl(tot-rec)+'</b></div></div>';
  h+='<div class="sub" style="margin:0 4px 8px">Total do mês: '+brl(tot)+'</div>';
  h+=it.length?it.map(x=>'<div class="card" data-'+(x.k==='a'?'a':'p')+'="'+x.id+'"><div class="mid"><b>'+esc(x.pet)+'</b><small>'+esc(x.sub)+' · '+fmtS(x.d)+'</small></div><div class="right"><b>'+brl(x.v)+'</b>'+badge(x.v,x.r)+'</div></div>').join(''):'<div class="empty">Nada neste mês.</div>';
  h+='<div class="day">Tabela de preços</div><div class="card" style="display:block"><div class="g2">'+TIPOS.map(t=>'<div><label>'+t+'</label><input type="number" inputmode="decimal" data-preco="'+t+'" value="'+(S.precos[t]??'')+'"></div>').join('')+'</div></div>';
  h+='<div class="day">Backup</div><div class="card" style="display:block"><div class="sub">Seus dados ficam só neste aparelho. Exporte um backup de vez em quando. "Importar" restaura ou troca de celular (substitui os dados atuais).</div><button class="btn" id="bx">Exportar backup</button><button class="btn sec" id="bi">Importar backup</button><input type="file" id="bf" accept=".json,application/json" class="h"></div>';
  return h;
}

function vClientes(){
  const h='<input id="q" placeholder="🔍 Buscar pet ou tutor" style="margin:8px 0">';
  if(!S.clientes.length)return h+'<div class="empty">Nenhum cliente cadastrado.<br>Toque no + para cadastrar.</div>';
  return h+[...S.clientes].sort((a,b)=>a.pet.localeCompare(b.pet)).map(c=>'<div class="card" data-c="'+c.id+'"><div class="mid"><b>'+esc(c.pet)+(c.porte?' <span class="bd nt">'+esc(c.porte)+'</span>':'')+'</b><small>'+esc([c.tutor,c.raca].filter(Boolean).join(' · ')||'—')+(c.end?'<br>📍 '+esc(c.end):'')+'</small></div>'+(c.tel?'<a class="bd ok" style="text-decoration:none;font-size:16px" target="_blank" rel="noopener" href="'+wa(c,'')+'">💬</a>':'')+'</div>').join('');
}
function fCliente(id){
  const n=!id,c=n?{pet:'',tutor:'',tel:'',end:'',raca:'',porte:'',obs:''}:S.clientes.find(x=>x.id===id);
  sheet('<h2>'+(n?'Novo cliente':esc(c.pet))+'</h2><label>Nome do pet</label><input id="cp" value="'+esc(c.pet)+'"><label>Tutor</label><input id="cu" value="'+esc(c.tutor)+'"><label>Telefone / WhatsApp</label><input id="ct" type="tel" inputmode="tel" value="'+esc(c.tel)+'" placeholder="(11) 99999-9999"><label>Endereço</label><input id="ce" value="'+esc(c.end)+'"><div class="g2"><div><label>Raça</label><input id="cr" value="'+esc(c.raca)+'"></div><div><label>Porte</label><select id="cq"><option value="">—</option>'+opts(['Pequeno','Médio','Grande'],c.porte)+'</select></div></div><label>Observações</label><input id="co" value="'+esc(c.obs)+'" placeholder="Alergias, temperamento…">'+(c.tel?'<a class="btn sec" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="'+wa(c,'')+'">💬 Abrir WhatsApp</a>':'')+'<button class="btn" id="cs">Salvar</button><button class="btn sec" id="cc">Cancelar</button>'+(n?'':'<button class="btn del" id="cx">Excluir cliente</button>'));
  $('#cc').onclick=close;
  $('#cs').onclick=()=>{const nome=val('cp').trim();if(!nome)return;const old=c.pet;Object.assign(c,{pet:nome,tutor:val('cu').trim(),tel:val('ct').trim(),end:val('ce').trim(),raca:val('cr').trim(),porte:val('cq'),obs:val('co').trim()});if(n){c.id=uid();S.clientes.push(c)}else if(old!==nome){S.atend.forEach(a=>{if(a.pet===old)a.pet=nome});S.pacotes.forEach(p=>{if(p.pet===old)p.pet=nome})}save();close();render()};
  if(!n)armDel($('#cx'),()=>{S.clientes=S.clientes.filter(x=>x.id!==id);save();close();render()});
}

/* ---------- formulários ---------- */
const sheet=h=>{$('#sh').innerHTML=h;$('#ov').classList.add('show');$('#sh').scrollTop=0};
const close=()=>$('#ov').classList.remove('show');
const opts=(arr,sel)=>arr.map(x=>'<option '+(x===sel?'selected':'')+'>'+esc(x)+'</option>').join('');
const dl='<datalist id="pets">'+'</datalist>';
const val=id=>$('#'+id).value;
function armDel(btn,fn){btn.onclick=()=>{if(btn.dataset.s){fn()}else{btn.dataset.s=1;btn.textContent='Toque de novo para excluir'}}}

function fAtend(id,pacId){
  const n=!id,a=n?{pet:pacOf(pacId)?.pet||'',tipo:pacOf(pacId)?.tipo||'Banho',data:today(),hora:'09:00',valor:S.precos.Banho||0,recebido:0,pacote:pacId||'',feito:false,obs:''}:S.atend.find(x=>x.id===id);
  sheet('<h2>'+(n?'Novo atendimento':'Editar atendimento')+'</h2>'+
  '<label>Pet</label><input id="fp" list="pl" value="'+esc(a.pet)+'" autocomplete="off"><datalist id="pl">'+petNames().map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>'+
  '<div id="fi"></div><label>Serviço</label><select id="ft">'+opts(TIPOS,a.tipo)+'</select>'+
  '<div class="g2"><div><label>Data</label><input id="fd" type="date" value="'+a.data+'"></div><div><label>Hora</label><input id="fh" type="time" value="'+a.hora+'"></div></div>'+
  '<label>Pacote</label><select id="fk"><option value="">Avulso (sem pacote)</option>'+S.pacotes.map(p=>'<option value="'+p.id+'" '+(p.id===a.pacote?'selected':'')+'>'+esc(p.pet)+' — '+p.qtd+'x '+esc(p.tipo)+'</option>').join('')+'</select>'+
  '<div id="fv"><div class="g2"><div><label>Valor (R$)</label><input id="fvv" type="number" inputmode="decimal" value="'+a.valor+'"></div><div><label>Recebido (R$)</label><input id="fr" type="number" inputmode="decimal" value="'+(a.recebido||0)+'"></div></div><button class="btn sec" id="fq" style="margin-top:8px">Marcar como pago</button></div>'+
  '<label>Observações</label><input id="fo" value="'+esc(a.obs)+'" placeholder="Endereço, cuidados…">'+
  '<label style="display:flex;gap:10px;align-items:center;color:var(--tx)"><input id="ff" type="checkbox" style="width:22px;height:22px" '+(a.feito?'checked':'')+'> Atendimento realizado</label>'+
  '<button class="btn" id="fs">Salvar</button><button class="btn sec" id="fc">Cancelar</button>'+(n?'':'<button class="btn del" id="fx">Excluir</button>'));
  const info=()=>{const c=cli(val('fp'));$('#fi').innerHTML=c?'<div class="vrow" style="display:block;margin-top:8px">'+(c.tutor?'👤 '+esc(c.tutor)+'<br>':'')+(c.end?'📍 '+esc(c.end)+'<br>':'')+(c.raca||c.porte?'🐾 '+esc([c.raca,c.porte].filter(Boolean).join(' · '))+'<br>':'')+(c.obs?'📝 '+esc(c.obs)+'<br>':'')+(c.tel?'<a class="btn sec" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="'+wa(c,'Olá'+(c.tutor?', '+c.tutor:'')+'! Passando para confirmar o '+val('ft').toLowerCase()+' do '+c.pet+' em '+fmtD(val('fd'))+' às '+val('fh')+'. Tudo certo? 🐶')+'">💬 Avisar no WhatsApp</a>':'')+'</div>':''};
  ['fp','ft','fd','fh'].forEach(i=>$('#'+i).addEventListener('input',info));info();
  const tog=()=>$('#fv').classList.toggle('h',!!val('fk'));tog();
  $('#fk').onchange=()=>{tog();const q=pacOf(val('fk'));if(q){$('#fp').value=q.pet;$('#ft').value=q.tipo}};
  $('#ft').onchange=()=>{if(n)$('#fvv').value=S.precos[val('ft')]||0};
  $('#fq').onclick=()=>{$('#fr').value=val('fvv')};
  $('#fc').onclick=close;
  $('#fs').onclick=()=>{
    if(!val('fp').trim()||!val('fd'))return;
    Object.assign(a,{pet:val('fp').trim(),tipo:val('ft'),data:val('fd'),hora:val('fh')||'09:00',pacote:val('fk'),valor:+val('fvv')||0,recebido:+val('fr')||0,obs:val('fo').trim(),feito:$('#ff').checked});
    if(a.pacote){a.valor=0;a.recebido=0}
    if(n){a.id=uid();S.atend.push(a)}
    save();close();render();
  };
  if(!n)armDel($('#fx'),()=>{S.atend=S.atend.filter(x=>x.id!==id);save();close();render()});
}
function fPacote(id){
  const n=!id,p=n?{pet:'',tipo:'Banho',qtd:4,valor:(S.precos.Banho||0)*4,recebido:0,obs:''}:pacOf(id);
  const vs=n?[]:visitas(id);
  sheet('<h2>'+(n?'Novo pacote':'Pacote de '+esc(p.pet))+'</h2>'+
  '<label>Pet</label><input id="pp" list="pl" value="'+esc(p.pet)+'" autocomplete="off"><datalist id="pl">'+petNames().map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>'+
  '<label>Serviço</label><select id="pt">'+opts(TIPOS,p.tipo)+'</select>'+
  (n?'<div class="g2"><div><label>Nº de banhos</label><input id="pq" type="number" inputmode="numeric" value="4"></div><div><label>Intervalo (dias)</label><select id="pi">'+[7,14,15,21,30].map(x=>'<option '+(x===7?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><div class="g2"><div><label>1º atendimento</label><input id="pd" type="date" value="'+today()+'"></div><div><label>Hora</label><input id="ph" type="time" value="09:00"></div></div>':'')+
  '<div class="g2"><div><label>Valor do pacote (R$)</label><input id="pv" type="number" inputmode="decimal" value="'+p.valor+'"></div><div><label>Recebido (R$)</label><input id="pr" type="number" inputmode="decimal" value="'+(p.recebido||0)+'"></div></div>'+
  '<button class="btn sec" id="pq2" style="margin-top:8px">Marcar como pago</button>'+
  '<label>Observações</label><input id="po" value="'+esc(p.obs)+'">'+
  (n?'':'<div class="day">Atendimentos do pacote ('+vs.filter(x=>x.feito).length+'/'+vs.length+')</div>'+vs.map(v=>'<div class="vrow" data-a="'+v.id+'"><span>'+fmtD(v.data)+' · '+esc(v.hora)+'</span><span>'+(v.feito?'✓ feito':'agendado')+'</span></div>').join('')+'<button class="btn sec" id="pa">+ Adicionar atendimento ao pacote</button>')+
  '<button class="btn" id="ps">Salvar</button><button class="btn sec" id="pc">Cancelar</button>'+(n?'':'<button class="btn del" id="px">Excluir pacote e atendimentos</button>'));
  $('#pq2').onclick=()=>{$('#pr').value=val('pv')};
  $('#pc').onclick=close;
  if(n)$('#pt').onchange=()=>{$('#pv').value=(S.precos[val('pt')]||0)*(+val('pq')||1)};
  if(n)$('#pq').oninput=()=>{$('#pv').value=(S.precos[val('pt')]||0)*(+val('pq')||1)};
  if(!n)$('#pa').onclick=()=>fAtend(null,id);
  $('#ps').onclick=()=>{
    if(!val('pp').trim())return;
    Object.assign(p,{pet:val('pp').trim(),tipo:val('pt'),valor:+val('pv')||0,recebido:+val('pr')||0,obs:val('po').trim()});
    if(n){
      p.id=uid();p.qtd=Math.max(1,Math.min(60,+val('pq')||1));S.pacotes.push(p);
      for(let i=0;i<p.qtd;i++)S.atend.push({id:uid(),pet:p.pet,tipo:p.tipo,data:addDays(val('pd')||today(),i*(+val('pi'))),hora:val('ph')||'09:00',valor:0,recebido:0,pacote:p.id,feito:false,obs:''});
    }else{S.atend.filter(a=>a.pacote===id).forEach(a=>{a.pet=p.pet})}
    save();close();render();
  };
  if(!n)armDel($('#px'),()=>{S.atend=S.atend.filter(a=>a.pacote!==id);S.pacotes=S.pacotes.filter(x=>x.id!==id);save();close();render()});
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target,c=s=>t.closest(s);
  if(t.id==='ov'){close();return}
  if(t.id==='bx'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='banho-tosa-backup-'+today()+'.json';a.click();return}
  if(t.id==='bi'){$('#bf').click();return}
  if(c('a'))return;
  let x;
  if(x=c('#nv button')){tab=x.dataset.t;render();return}
  if(x=c('[data-past]')){past=x.dataset.past==='1';render();return}
  if(x=c('[data-m]')){const [y,m]=mes.split('-');mes=isoD(new Date(+y,+m-1+ +x.dataset.m,1)).slice(0,7);render();return}
  if(x=c('[data-done]')){const a=S.atend.find(z=>z.id===x.dataset.done);a.feito=!a.feito;save();render();return}
  if(c('#fab')){tab==='pacotes'?fPacote():tab==='clientes'?fCliente():fAtend();return}
  if(x=c('[data-c]')){fCliente(x.dataset.c);return}
  if(c('#sh')&&!c('.vrow')&&!c('[data-a]'))return;
  if(x=c('[data-a]')){fAtend(x.dataset.a);return}
  if(x=c('[data-p]')){fPacote(x.dataset.p);return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='bf'&&t.files[0]){t.files[0].text().then(x=>{const d=JSON.parse(x);if(!Array.isArray(d.atend))throw 0;S=Object.assign({precos:{},atend:[],pacotes:[],clientes:[]},d);save();render()}).catch(()=>setSt('⚠ arquivo inválido'));t.value='';return}
  if(t.dataset&&t.dataset.preco){S.precos[t.dataset.preco]=+t.value||0;save()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){const q=e.target.value.toLowerCase();document.querySelectorAll('.card[data-c]').forEach(c=>{c.style.display=c.textContent.toLowerCase().includes(q)?'':'none'})}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script>
</body>
